name: CI and staging

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/proasepsis/despacha

jobs:
  test:
    # EMERGENCIA (incidente de runners hospedados de GitHub, 2026-10-05): en push a main
    # corre en el runner propio; los PR siguen en GitHub. Revertir cuando se normalice.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","linux","x64","despacha-deploy"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: github.event_name != 'push'
        with:
          python-version: "3.13"
          cache: pip
      # EMERGENCIA: el runner propio es Debian 13 y setup-python no publica Python para esa
      # distro; se usa el Python 3.13 del sistema en un venv. Revertir junto con runs-on.
      - name: Python del sistema (runner propio)
        if: github.event_name == 'push'
        run: |
          python3.13 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r requirements.txt
      - name: Validate dependencies
        run: pip check
      - name: Check pending migrations
        env:
          DJANGO_SETTINGS_MODULE: despacha.settings_test
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: despacha.settings_test
        run: python manage.py test

  image:
    needs: test
    # EMERGENCIA (incidente de runners hospedados de GitHub, 2026-10-05): en push a main
    # corre en el runner propio; los PR siguen en GitHub. Revertir cuando se normalice.
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","linux","x64","despacha-deploy"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          # Docker Hub no es alcanzable desde el runner propio (ruta del proveedor cortada);
          # buildkit se baja de ECR Public. Mismo contenido, otro registro.
          driver-opts: image=public.ecr.aws/vend/moby/buildkit:buildx-stable-1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          # EMERGENCIA: el servicio de caché de GitHub Actions está caído (devuelve HTML de error y
          # tumba el build). En push a main se construye sin caché; en PR sigue la caché gha.
          cache-from: ${{ github.event_name != 'push' && 'type=gha' || '' }}
          cache-to: ${{ github.event_name != 'push' && 'type=gha,mode=max' || '' }}

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: [self-hosted, linux, x64, despacha-deploy]
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy immutable image to staging
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ needs.image.outputs.digest }}
        run: bash scripts/deploy-image.sh staging "$IMAGE" "$GITHUB_WORKSPACE/docker-compose.yml"
