services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-despacha}
      POSTGRES_USER: ${DB_USER:-despacha}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH:-/home/despachos/postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-despacha} -d ${DB_NAME:-despacha}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - despacha_net

  web:
    image: ${WEB_IMAGE:-despacha-web}
    build: .
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${SECRETS_PATH:-/opt/despacha/secrets}:/secrets:ro
      - ${LOGS_PATH:-/opt/despacha/logs}:/app/logs
    restart: always
    networks:
      - despacha_net

networks:
  despacha_net:
    driver: bridge
